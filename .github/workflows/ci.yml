name: Offline checks

"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      OPENAI_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-lock.txt
      - name: Install the recorded development environment
        run: python -m pip install -r requirements-dev-lock.txt
      - name: Run application, evaluation and packaging tests
        run: python -m pytest tests evaluation/pilot/test_dataset.py -q
      - name: Run the scripted offline graph demo
        run: python examples/offline_agent_demo.py
      - name: Replay the recorded final comparison
        run: python -m evaluation.run_holdout --verify
      - name: Build the public-source package
        run: python scripts/package_source.py --output dist/studyrag-source.zip
